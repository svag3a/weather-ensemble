name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build frontend in CI — avoids OOM on the small EC2 instance
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # Report host health, and clean up ONLY when disk is actually low.
      # Aggressive cleanup destroys diagnostics — journald holds the OOM
      # records — so it must not run on every deploy.
      - name: Server health check
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            ubuntu@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          echo "--- disk ---"
          df -h /
          echo "--- memory ---"
          free -h
          echo "--- OOM kills, last 7 days ---"
          sudo journalctl -k --since '7 days ago' 2>/dev/null \
            | grep -ci 'oom-kill\|out of memory' || echo 0

          AVAIL=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "${AVAIL:-0}" -lt 5 ]; then
            echo "!!! only ${AVAIL}G free — running cleanup"
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            sudo journalctl --vacuum-size=200M 2>/dev/null || true
            df -h /
          else
            echo "${AVAIL}G free — skipping cleanup, diagnostics preserved"
          fi
          REMOTE

      # Pull latest code on server (updates Dockerfile etc, won't touch dist/)
      - name: Pull latest code
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            ubuntu@${{ secrets.EC2_HOST }} \
            "cd ~/weather-ensemble && git fetch origin && git reset --hard origin/main && echo 'ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}' > .env && echo 'GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}' >> .env && echo 'GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}' >> .env && echo 'GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}' >> .env && echo 'REVENUECAT_WEBHOOK_SECRET=${{ secrets.REVENUECAT_WEBHOOK_SECRET }}' >> .env"

      # Copy pre-built frontend (dist is gitignored, git pull won't overwrite it)
      - name: Copy frontend dist to server
        run: |
          scp -i ~/.ssh/deploy_key -r \
            frontend/dist \
            ubuntu@${{ secrets.EC2_HOST }}:~/weather-ensemble/frontend/

      # Build the new image BEFORE swapping. A failed build now leaves the
      # running container untouched, so a broken build can no longer take the
      # site down — that required disk headroom for two images, which the
      # 8 GiB volume did not have before 2026-08-04.
      - name: Build and swap
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=200 \
            ubuntu@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/weather-ensemble

          echo "=== building new image (current container keeps serving) ==="
          docker compose build

          echo "=== swapping to new image ==="
          docker compose up -d

          if ! command -v curl >/dev/null 2>&1; then
            echo "curl unavailable — skipping health gate"
            exit 0
          fi

          echo "=== waiting for health ==="
          for i in $(seq 1 20); do
            if curl -fsS -m 5 http://localhost:8000/health >/dev/null 2>&1; then
              echo "healthy after $((i * 3))s"
              docker image prune -f || true
              df -h /
              exit 0
            fi
            sleep 3
          done

          echo "!!! app did not become healthy within 60s"
          docker compose ps
          docker compose logs --tail 80 app
          exit 1
          REMOTE
